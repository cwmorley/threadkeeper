name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Unit and CLI tests (no dependencies, no network)
        run: npm test
      - name: Smoke check on the bundled fixture
        run: |
          node src/threadkeeper.mjs ingest corpus/moonstone-smoke.md --out work/ci-smoke
          node src/threadkeeper.mjs review work/ci-smoke
